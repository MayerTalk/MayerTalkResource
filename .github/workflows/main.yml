name: Auto Update

on:
  push:
  issue_comment:
    types: [created]
  schedule:
    - cron:  '10 0/1 * * *'

jobs:
  AutoUpdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --python 3.12 --locked
          
      - name: Run
        env:
          SERVER: ${{ secrets.SERVER }}
          KEY: ${{ secrets.KEY }}
        run: |
          git config --global user.email noreply@arkfans.top
          git config --global user.name MeeBooBot_v1
          uv run --python 3.12 python update_arknights.py
      
      - name: Commit Change
        run: |
          git push
        if: env.update == 1
